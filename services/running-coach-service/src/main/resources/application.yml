spring:
  application:
    name: running-coach-service
  datasource:
    url: ${RUNNING_DB_URL}
    username: ${RUNNING_DB_USER}
    password: ${RUNNING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${RUNNING_JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${PORT:${SERVER_PORT:8088}}

stride:
  cors:
    allowed-origin-patterns: ${STRIDE_CORS_ALLOWED_ORIGIN_PATTERNS:https://stridemate-wine.vercel.app,http://localhost:*}
  ai:
    ollama-base-url: ${OLLAMA_BASE_URL}
    ollama-api-key: ${OLLAMA_API_KEY}
    plan-model: ${OLLAMA_PLAN_MODEL}
    feedback-model: ${OLLAMA_FEEDBACK_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

