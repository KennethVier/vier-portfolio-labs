spring:
  application:
    name: running-coach-service
  datasource:
    url: ${RUNNING_DB_URL:jdbc:postgresql://localhost:5432/running_coach_db}
    username: ${RUNNING_DB_USER:portfolio_admin}
    password: ${RUNNING_DB_PASSWORD:portfolio_admin_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${RUNNING_JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${SERVER_PORT:8088}

stride:
  ai:
    ollama-base-url: ${OLLAMA_BASE_URL:https://ollama.com/api}
    ollama-api-key: ${OLLAMA_API_KEY:}
    plan-model: ${OLLAMA_PLAN_MODEL:gpt-oss:20b-cloud}
    feedback-model: ${OLLAMA_FEEDBACK_MODEL:gpt-oss:20b-cloud}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
