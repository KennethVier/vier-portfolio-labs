spring:
  application:
    name: api-gateway

server:
  port: ${SERVER_PORT:8080}

platform:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8083}
    todo-url: ${TODO_SERVICE_URL:http://localhost:8084}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
    document-url: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
    quiz-url: ${QUIZ_SERVICE_URL:http://localhost:8082}
    shop-url: ${SHOP_SERVICE_URL:http://localhost:8086}
    employee-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8087}
    running-url: ${RUNNING_SERVICE_URL:http://localhost:8088}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true






