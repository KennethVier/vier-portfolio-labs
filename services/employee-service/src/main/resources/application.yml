spring:
  application:
    name: employee-service
  datasource:
    url: ${EMPLOYEE_DB_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${EMPLOYEE_DB_USER:portfolio_admin}
    password: ${EMPLOYEE_DB_PASSWORD:portfolio_admin_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${EMPLOYEE_JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true