spring.application.name=auth-service
jwt.secret=${JWT_SECRET}

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${AUTH_JPA_DDL_AUTO:update}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8083/login/oauth2/code/google}

server.port=${SERVER_PORT:8083}

platform.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080}
platform.oauth2.success-redirect-url=${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:5173/auth/oauth2/success}


