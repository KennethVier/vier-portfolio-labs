name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-checks:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install main portfolio dependencies
        working-directory: apps/main-portfolio
        run: npm ci

      - name: Build main portfolio
        working-directory: apps/main-portfolio
        run: npm run build

      - name: Install shop dependencies
        working-directory: apps/shop-web
        run: npm ci

      - name: Check shop
        working-directory: apps/shop-web
        run: |
          npm run lint
          npm run build

      - name: Install PeopleOps dependencies
        working-directory: apps/peopleops-web
        run: npm ci

      - name: Check PeopleOps
        working-directory: apps/peopleops-web
        run: |
          npm run lint
          npm run build

      - name: Install StrideMate dependencies
        working-directory: apps/stridemate-web
        run: npm ci

      - name: Check StrideMate
        working-directory: apps/stridemate-web
        run: |
          npm run test
          npm run lint
          npm run build

      - name: Install Yomira dependencies
        working-directory: apps/yomira-web
        run: npm ci

      - name: Check Yomira
        working-directory: apps/yomira-web
        run: |
          npm run lint
          npm run build

      - name: Install TodoFlow dependencies
        working-directory: apps/todo-web
        run: npm ci

      - name: Build TodoFlow
        working-directory: apps/todo-web
        run: npm run build

      - name: Install Authly dependencies
        working-directory: apps/auth-web
        run: npm ci

      - name: Check Authly
        working-directory: apps/auth-web
        run: |
          npm run lint
          npm run build
