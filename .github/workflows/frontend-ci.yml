name: Frontend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-checks:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install main portfolio dependencies
        run: npm ci --prefix apps/main-portfolio

      - name: Build main portfolio
        run: npm --prefix apps/main-portfolio run build

      - name: Install shop dependencies
        run: npm ci --prefix apps/shop-web

      - name: Check shop
        run: |
          npm --prefix apps/shop-web run lint
          npm --prefix apps/shop-web run build

      - name: Install PeopleOps dependencies
        run: npm ci --prefix apps/peopleops-web

      - name: Check PeopleOps
        run: |
          npm --prefix apps/peopleops-web run lint
          npm --prefix apps/peopleops-web run build

      - name: Install StrideMate dependencies
        run: npm ci --prefix apps/stridemate-web

      - name: Check StrideMate
        run: |
          npm --prefix apps/stridemate-web run test
          npm --prefix apps/stridemate-web run lint
          npm --prefix apps/stridemate-web run build

      - name: Install Yomira dependencies
        run: npm ci --prefix apps/yomira-web

      - name: Check Yomira
        run: |
          npm --prefix apps/yomira-web run lint
          npm --prefix apps/yomira-web run build

      - name: Install TodoFlow dependencies
        run: npm ci --prefix apps/todo-web

      - name: Build TodoFlow
        run: npm --prefix apps/todo-web run build

      - name: Install Authly dependencies
        run: npm ci --prefix apps/auth-web

      - name: Check Authly
        run: |
          npm --prefix apps/auth-web run lint
          npm --prefix apps/auth-web run build
