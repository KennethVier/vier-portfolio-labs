name: PesoPilot Business Prototype

on:
  pull_request:
    branches: [pesopilot-dev]
    paths:
      - 'apps/pesopilot-web/**'
      - 'docs/pesopilot-business/**'

jobs:
  business-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pesopilot-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pesopilot-web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
